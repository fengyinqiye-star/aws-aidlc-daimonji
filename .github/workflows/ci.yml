name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - construction

permissions:
  contents: read
  pull-requests: write

jobs:
  backend-unit:
    name: Backend Unit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/infrastructure-support/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend/infrastructure-support

      - name: Lint backend
        run: npm run lint

      - name: Build backend
        run: npm run build

      - name: Run backend unit tests
        run: npm run test:unit

  backend-integration:
    name: Backend Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/infrastructure-support/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend/infrastructure-support

      - name: Run backend integration tests
        run: npm run test:integration

  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Check Terraform formatting
        run: npm run terraform:fmt:check

      - name: Validate Terraform
        run: npm run terraform:validate

  report:
    name: CI Report
    if: always()
    needs:
      - backend-unit
      - backend-integration
      - terraform
    runs-on: ubuntu-latest

    steps:
      - name: Publish PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          BACKEND_UNIT_RESULT: ${{ needs.backend-unit.result }}
          BACKEND_INTEGRATION_RESULT: ${{ needs.backend-integration.result }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- infrastructure-support-ci-report -->';
            const body = `${marker}
            ## Infrastructure Support CI
            - Backend Unit: ${process.env.BACKEND_UNIT_RESULT}
            - Backend Integration: ${process.env.BACKEND_INTEGRATION_RESULT}
            - Terraform Validate: ${process.env.TERRAFORM_RESULT}
            - Workflow Run: ${process.env.RUN_URL}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number
            });
            const existing = comments.find((comment) => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
